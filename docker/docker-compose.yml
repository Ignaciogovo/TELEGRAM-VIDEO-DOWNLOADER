version: '3.8'

services:
  telegram-downloader:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: telegram-downloader
    restart: "no"
    
    volumes:
      - telegram_downloads:/app/downloads
      - telegram_logs:/app/logs
      - telegram_notifications:/app/notifications
      - ../config.yaml:/app/config.yaml:ro
      - ../.env:/app/.env:ro
      - ../telegram_downloader.session:/app/telegram_downloader.session
      - telegram_session:/app/session
    
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'
    
    read_only: true
    tmpfs:
      - /tmp
    
    environment:
      - TZ=Europe/Madrid
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-admin@example.com}

volumes:
  telegram_downloads:
    driver: local
  telegram_logs:
    driver: local
  telegram_notifications:
    driver: local
  telegram_session:
    driver: local
