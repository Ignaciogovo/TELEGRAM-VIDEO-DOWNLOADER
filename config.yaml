# Nombre de la sesión (archivo .session donde se guarda la autenticación)
session_name: "telegram_downloader"

# Directorio donde se guardarán los vídeos descargados
output_dir: "./downloads"

# Nivel de log: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level: "INFO"

# ============================================
# FASE 2: Mapeo de canales a carpetas
# ============================================
# Las carpetas se asignan por el orden de TELEGRAM_CHANNELS en .env
# Índice 0 = primer canal, 1 = segundo, 2 = tercero, etc.
# Canales sin índice definido → default_folder
channel_folders:
  0: "peliculas"

default_folder: "uncategorized"

# ============================================
# FASE 2: Filtros de descarga
# ============================================

# Duración mínima en segundos para descargar un vídeo
# Los vídeos más cortos se registran como "saltados" y no se vuelven a evaluar
min_duration_seconds: 300

# Segundos de espera entre cada descarga
download_delay_seconds: 30

# Máximo número de descargas por día
max_daily_downloads: 50

# ============================================
# FASE 2: Escaneo de seguridad
# ============================================
security:
  # Activar/desactivar escaneo de seguridad
  enabled: true
  # Motor de escaneo: "clamav" o "virustotal"
  engine: "clamav"
  # Probabilidad de escanear cada vídeo (0.0 a 1.0)
  # 0.1 = 10% de los vídeos se escanean (tipo aeropuerto)
  scan_probability: 0.1
